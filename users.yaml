aws_accounts:
  - name: dev
  - name: prod

github_teams:
  - name: backend
    description: "Backend engineering team"
    privacy: closed
  - name: frontend
    description: "Frontend engineering team"
    privacy: closed

iam_groups:
  - name: backend-developers
    account: dev
    policy_arn: "arn:aws:iam::982081070021:policy/dev-backend-developers"
    path: "/engineering/"
  - name: backend-developers
    account: prod
    policy_arn: "arn:aws:iam::451620995551:policy/prod-backend-developers"
    path: "/engineering/"
  - name: frontend-developers
    account: dev
    policy_arn: "arn:aws:iam::982081070021:policy/dev-frontend-developers"
    path: "/engineering/"
  - name: frontend-developers
    account: prod
    policy_arn: "arn:aws:iam::451620995551:policy/prod-frontend-developers"
    path: "/engineering/"

users:
  - name: exztinct01
    github:
      team: backend
      role: admin
      team_role: maintainer
    iam_assignments:
      - account: dev
        iam_group: backend-developers
      # - account: prod
      #   iam_group: backend-developers
  - name: jssoriao19
    github:
      team: frontend
    iam_assignments:
      - account: dev
        iam_group: frontend-developers
