AWSTemplateFormatVersion: "2010-09-09"
Description: "DEV managed IAM policy for backend-developers group — full S3 and DynamoDB access"

Resources:
  BackendDevelopersPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: "dev-backend-developers"
      Description: "DEV least-privilege policy for backend developers — S3 app data read/write and DynamoDB read/write"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3ListBuckets
            Effect: "Allow"
            Action:
              - "s3:ListAllMyBuckets"
            Resource: "*"

          - Sid: AllowS3AppDataAccess
            Effect: "Allow"
            Action:
              - "s3:GetBucketLocation"
              - "s3:ListBucket"
              - "s3:ListBucketVersions"
              - "s3:GetBucketVersioning"
              - "s3:GetObject"
              - "s3:GetObjectVersion"
              - "s3:PutObject"
              - "s3:DeleteObject"
              - "s3:DeleteObjectVersion"
            Resource:
              - "arn:aws:s3:::dev-backend-developers-*"
              - "arn:aws:s3:::dev-backend-developers-*/*"

          - Sid: DenyS3ProtectedBucketPatterns
            Effect: "Deny"
            Action:
              - "s3:*"
            Resource:
              - "arn:aws:s3:::*-*alblogs*"
              - "arn:aws:s3:::*-*cdn-logs*"
              - "arn:aws:s3:::*-*cloudtraillogs*"
              - "arn:aws:s3:::*-*-logs-*"
              - "arn:aws:s3:::*-*-logs"
              - "arn:aws:s3:::*-*-log-*"
              - "arn:aws:s3:::*-*-log"
              - "arn:aws:s3:::*-*terragrunt*"
              - "arn:aws:s3:::*-*terraform*"
              - "arn:aws:s3:::*-cdk-*"
              - "arn:aws:s3:::*-cf-templates-*"
              - "arn:aws:s3:::*-*devops*"
              - "arn:aws:s3:::*-*accesslog*"
              - "arn:aws:s3:::*-*sessionlog*"
              - "arn:aws:s3:::*-*cloudfrontlog*"
              - "arn:aws:s3:::*-*flowlog*"
              - "arn:aws:s3:::*-*alblogs*/*"
              - "arn:aws:s3:::*-*cdn-logs*/*"
              - "arn:aws:s3:::*-*cloudtraillogs*/*"
              - "arn:aws:s3:::*-*-logs-*/*"
              - "arn:aws:s3:::*-*-logs/*"
              - "arn:aws:s3:::*-*-log-*/*"
              - "arn:aws:s3:::*-*-log/*"
              - "arn:aws:s3:::*-*terragrunt*/*"
              - "arn:aws:s3:::*-*terraform*/*"
              - "arn:aws:s3:::*-cdk-*/*"
              - "arn:aws:s3:::*-cf-templates-*/*"
              - "arn:aws:s3:::*-*devops*/*"
              - "arn:aws:s3:::*-*accesslog*/*"
              - "arn:aws:s3:::*-*sessionlog*/*"
              - "arn:aws:s3:::*-*cloudfrontlog*/*"
              - "arn:aws:s3:::*-*flowlog*/*"

          - Sid: AllowDynamoDBTableAccess
            Effect: "Allow"
            Action:
              - "dynamodb:GetItem"
              - "dynamodb:PutItem"
              - "dynamodb:UpdateItem"
              - "dynamodb:DeleteItem"
              - "dynamodb:Query"
              - "dynamodb:Scan"
              - "dynamodb:BatchGetItem"
              - "dynamodb:BatchWriteItem"
              - "dynamodb:DescribeTable"
              - "dynamodb:ListTables"
            Resource:
              - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/dev-backend-developers-*"
              - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/dev-backend-developers-*/index/*"

          - Sid: AllowKmsForS3AndDynamoDB
            Effect: "Allow"
            Action:
              - "kms:Decrypt"
              - "kms:Encrypt"
              - "kms:GenerateDataKey*"
              - "kms:DescribeKey"
            Resource:
              - !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
            Condition:
              StringEquals:
                kms:ViaService:
                  - !Sub "s3.${AWS::Region}.amazonaws.com"
                  - !Sub "dynamodb.${AWS::Region}.amazonaws.com"

Outputs:
  PolicyArn:
    Description: "ARN of the dev backend-developers managed policy"
    Value: !Ref BackendDevelopersPolicy
    Export:
      Name: "dev-backend-developers-policy-arn"
